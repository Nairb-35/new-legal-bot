name: Bilingual Legal News Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# External cron and GitHub schedules must not check/post the same news in parallel.
concurrency:
  group: legal-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install feedparser requests deep-translator
      - name: Run script
        env:
          TELEGRAMBOTTOKEN: ${{ secrets.TELEGRAMBOTTOKEN }}
          NOTIONTOKEN: ${{ secrets.NOTIONTOKEN }}
        run: python bilingual_news.py
